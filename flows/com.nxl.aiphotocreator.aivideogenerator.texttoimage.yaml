package: com.nxl.aiphotocreator.aivideogenerator.texttoimage
cases:
# Happy case cua widget_view: mo app -> qua onboarding -> popup Add Widget hien.
# `close_ad` tu tim nut dong (Skip Ad / dismiss-button / Close Billing Screen...)
# thay vi ghi cung mot resource_id: app nay co it nhat 3 kieu quang cao chan
# duong, moi kieu mot nut khac nhau, va kieu nao hien thi cung khong chac.
- event: widget_view
  label: popup Add Widget sau paywall
  steps:
  - kind: launch
  # Android 13+ hoi quyen thong bao ngay lan mo dau - dialog he thong nam de
  # tren app nen khong bam Cho phep thi moi selector sau deu khong thay gi.
  - kind: allow
    timeout: 15
  # Splash ad mat 5-8s moi ra nut Skip -> phai cho, khong kiem mot lan roi thoi.
  - kind: close_ad
    timeout: 25
  - kind: allow
    timeout: 5
  # Man Choose Language hien lai sau MOI lan relaunch cho toi khi di het
  # onboarding. Ca nhom duoi day `optional: true`: luot sau da qua onboarding
  # thi may man nay khong hien nua, khong tim thay node khong phai lai hut.
  - kind: tap
    resource_id: rootLanguageItem
    index: 1
    optional: true
  # Bam English chi MO RONG danh sach con - phai bam them bien the moi duoc
  # tinh la da chon. Khoa theo chu vi bien the khong co resource_id rieng.
  - kind: tap
    text: English (US)
    optional: true
  - kind: tap
    resource_id: imageButtonLanguageNext
    optional: true
  # Onboarding co BON trang (dem `indicatorPageOnboarding`: 4 dot), khong phai
  # ba. Ca bon trang dung chung mot id `btnNextOnboarding`, trang cuoi chi doi
  # chu thanh "Get Started" - nen bam id bon lan la di het.
  # Cho truoc khi bam phat dau: bam ngay sau man ngon ngu thi trang 1 chua kip
  # layout, buoc bi bo qua va con lai khong du so lan bam.
  - kind: wait
    seconds: 3
  - kind: tap
    resource_id: btnNextOnboarding
    optional: true
  - kind: wait
    seconds: 3
  - kind: tap
    resource_id: btnNextOnboarding
    optional: true
  - kind: wait
    seconds: 3
  - kind: tap
    resource_id: btnNextOnboarding
    optional: true
  - kind: wait
    seconds: 3
  - kind: tap
    resource_id: btnNextOnboarding
    optional: true
  - kind: wait
    seconds: 3
  # Chu tren man cau hoi KHAC nhau giua lan dau ("Which style fits your
  # vision?") va nhung lan sau ("Welcome back!..."), nen lay ten the lam moc -
  # no giong nhau ca hai lan.
  - kind: wait_text
    text: Glow Up Style
    timeout: 25
  - kind: tap
    resource_id: borderContainer
    index: 0
  - kind: tap
    resource_id: btnNextQuestion
    index: 0
  # Interstitial: lúc co lúc khong, cho toi 20s roi di tiep neu khong co.
  - kind: close_ad
    timeout: 20
  # Paywall cung vay.
  - kind: close_ad
    timeout: 15
  - kind: wait_text
    text: Add Widget
    timeout: 25

# Case nay CHAY TIEP tren man cua case tren (`relaunch: false`), khong mo lai app:
# popup Add Widget chi hien MOT LAN moi luot mo app. Ca luot chi ton dung mot
# lan khoi dong app cho ca hai event.
- event: widget_click
  label: bam Add Widget Now
  reset:
    relaunch: false
  steps:
  - kind: wait_text
    text: Add Widget Now
    timeout: 10
  # Khoa theo CHU vi nut khong co resource_id - vo neu app doi ngon ngu.
  - kind: tap
    text: Add Widget Now
    index: 0
