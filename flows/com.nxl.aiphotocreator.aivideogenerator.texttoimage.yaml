package: com.nxl.aiphotocreator.aivideogenerator.texttoimage
cases:
# Happy case cua widget_view: mo app -> qua onboarding -> popup Add Widget hien.
# `close_ad` tu tim nut dong (Skip Ad / dismiss-button / Close Billing Screen...)
# thay vi ghi cung mot resource_id: app nay co it nhat 3 kieu quang cao chan
# duong, moi kieu mot nut khac nhau, va kieu nao hien thi cung khong chac.
- event: widget_view
  label: popup Add Widget sau paywall
  steps:
  - kind: launch
  # Android 13+ hoi quyen thong bao ngay lan mo dau - dialog he thong nam de
  # tren app nen khong bam Cho phep thi moi selector sau deu khong thay gi.
  - kind: allow
    timeout: 15
  # Splash ad mat 5-8s moi ra nut Skip -> phai cho, khong kiem mot lan roi thoi.
  - kind: close_ad
    timeout: 25
  - kind: allow
    timeout: 5
  # Man Choose Language hien lai sau MOI lan relaunch cho toi khi di het
  # onboarding. Ca nhom duoi day `optional: true`: luot sau da qua onboarding
  # thi may man nay khong hien nua, khong tim thay node khong phai lai hut.
  - kind: tap
    resource_id: rootLanguageItem
    index: 1
    optional: true
  # Bam English chi MO RONG danh sach con - phai bam them bien the moi duoc
  # tinh la da chon. Khoa theo chu vi bien the khong co resource_id rieng.
  - kind: tap
    text: English (US)
    optional: true
  - kind: tap
    resource_id: imageButtonLanguageNext
    optional: true
  # Onboarding co BON trang (dem `indicatorPageOnboarding`: 4 dot), khong phai
  # ba. Ca bon trang dung chung mot id `btnNextOnboarding`, trang cuoi chi doi
  # chu thanh "Get Started" - nen bam id bon lan la di het.
  # Cho truoc khi bam phat dau: bam ngay sau man ngon ngu thi trang 1 chua kip
  # layout, buoc bi bo qua va con lai khong du so lan bam.
  - kind: wait
    seconds: 3
  - kind: tap
    resource_id: btnNextOnboarding
    optional: true
  - kind: wait
    seconds: 3
  - kind: tap
    resource_id: btnNextOnboarding
    optional: true
  - kind: wait
    seconds: 3
  - kind: tap
    resource_id: btnNextOnboarding
    optional: true
  - kind: wait
    seconds: 3
  - kind: tap
    resource_id: btnNextOnboarding
    optional: true
  - kind: wait
    seconds: 3
  # Chu tren man cau hoi KHAC nhau giua lan dau ("Which style fits your
  # vision?") va nhung lan sau ("Welcome back!..."), nen lay ten the lam moc -
  # no giong nhau ca hai lan.
  - kind: wait_text
    text: Glow Up Style
    timeout: 25
  - kind: tap
    resource_id: borderContainer
    index: 0
  - kind: tap
    resource_id: btnNextQuestion
    index: 0
  # Interstitial: lúc co lúc khong, cho toi 20s roi di tiep neu khong co.
  - kind: close_ad
    timeout: 20
  # Paywall cung vay.
  - kind: close_ad
    timeout: 15
  - kind: wait_text
    text: Add Widget
    timeout: 25

# Case nay CHAY TIEP tren man cua case tren (`relaunch: false`), khong mo lai app:
# popup Add Widget chi hien MOT LAN moi luot mo app. Ca luot chi ton dung mot
# lan khoi dong app cho ca hai event.
- event: widget_click
  label: bam Add Widget Now
  reset:
    relaunch: false
  steps:
  - kind: wait_text
    text: Add Widget Now
    timeout: 10
  # Khoa theo CHU vi nut khong co resource_id - vo neu app doi ngon ngu.
  - kind: tap
    text: Add Widget Now
    index: 0

# Popup rating xep hang NGAY SAU popup Add Widget o man home: dong Add Widget
# la no bat len luon, va SDK ghi placement_name=home (da soi logcat: event ra
# ngay luc popup Add Widget dong, chua bam Back gi ca).
#
# `exit_click` la mot placement KHAC cua cung popup nay: phai dong cai popup
# home o tren truoc, roi bam Back o home thi no hien lai va ghi exit_click.
# Khong gop duoc vao mot case - mot case mot event - nen case nay khoa theo
# `home`, la duong di ngan va chac hon.
#
# Khong can `clear_prefs`: popup hien lai moi lan, khong phai mot-lan-moi-cai
# nhu Add Widget. Ma may cam ban release, `run-as` bi chan thi clear_prefs
# cung khong chay duoc.
- event: rating_placement_viewed
  label: popup rating o man home
  expect_params:
    placement_name: home
  steps:
  - kind: launch
  - kind: allow
    timeout: 15
  - kind: close_ad
    timeout: 25
  - kind: allow
    timeout: 5
  # Nhom onboarding: chi hien khi app chua di het onboarding lan nao, nen ca
  # nhom `optional`. Giai thich tung buoc xem case widget_view o tren.
  - kind: tap
    resource_id: rootLanguageItem
    index: 1
    optional: true
  - kind: tap
    text: English (US)
    optional: true
  - kind: tap
    resource_id: imageButtonLanguageNext
    optional: true
  - kind: wait
    seconds: 3
  - kind: tap
    resource_id: btnNextOnboarding
    optional: true
  - kind: wait
    seconds: 3
  - kind: tap
    resource_id: btnNextOnboarding
    optional: true
  - kind: wait
    seconds: 3
  - kind: tap
    resource_id: btnNextOnboarding
    optional: true
  - kind: wait
    seconds: 3
  - kind: tap
    resource_id: btnNextOnboarding
    optional: true
  - kind: wait
    seconds: 3
  - kind: wait_text
    text: Glow Up Style
    timeout: 25
  - kind: tap
    resource_id: borderContainer
    index: 0
  - kind: tap
    resource_id: btnNextQuestion
    index: 0
  - kind: close_ad
    timeout: 20
  - kind: close_ad
    timeout: 15
  # Popup Add Widget nam de tren home ngay sau khi paywall dong. Dong theo
  # DANH TINH chu dung bam `desc=Close` bua: ca ba popup o home (Add Widget,
  # Check-In, rating) deu dat nut X la desc=Close, bam nham la dong mat cai
  # dang can do.
  - kind: close_popup
    text: Add Widget
  - kind: wait_text
    text: RATE
    timeout: 15

# Chay tiep tren popup rating cua case tren (`relaunch: false`): bam sao la
# thao tac ke tiep tren dung man do, mo lai app chi ton them mot luot
# onboarding + hai quang cao.
# Tap sao la du de event ban ra - da xac nhan tren logcat, khong phai doi bam
# tiep "Rate on Google Play".
- event: rating_star_clicked
  label: bam 5 sao tren popup rating
  expect_params:
    star_value: "5"
    placement_name: home
  reset:
    relaunch: false
  steps:
  - kind: tap
    desc: Star 5

# placement_name=exit_click: van la popup rating do, nhung phai DONG cai popup
# `home` o tren truoc roi bam Back o home thi SDK moi ghi exit_click. Chay tiep
# tren man cua case truoc (`relaunch: false`) - mo lai app chi de bam Back la
# ton them mot luot onboarding + hai quang cao.
#
# Buoc `tap desc=Close` dau tien dong cai popup dang o trang thai "We are
# thrilled..." con lai sau khi case tren bam sao.
- event: rating_placement_viewed
  label: popup rating khi bam Back o home
  expect_params:
    placement_name: exit_click
  reset:
    relaunch: false
  steps:
  - kind: tap
    desc: Close
  - kind: wait
    seconds: 2
  - kind: key
    text: BACK
  - kind: wait_text
    text: RATE
    timeout: 15

- event: rating_star_clicked
  label: bam 5 sao tren popup rating exit_click
  expect_params:
    star_value: "5"
    placement_name: exit_click
  reset:
    relaunch: false
  steps:
  - kind: tap
    desc: Star 5

# placement_name=app_shortcut: man rating dung rieng (VslRatingActivity),
# trong app khong co nut nao dan sang - chi toi duoc bang intent cua shortcut
# `vsl_rating_shortcut` (soi bang `adb shell dumpsys shortcut`).
#
# LUU Y NGON NGU: man nay ve theo locale cua MAY, khong theo ngon ngu da chon
# trong app - may dang de tieng Viet nen nut la `Sao 5` / `ĐÁNH GIÁ`, trong
# khi popup trong app o tren la `Star 5` / `RATE`. Doi locale may la hai case
# duoi day vo, con bon case tren thi khong.
- event: rating_placement_viewed
  label: man rating mo tu app shortcut
  expect_params:
    placement_name: app_shortcut
  reset:
    relaunch: false
  steps:
  - kind: intent
    action: com.apero.rating.action.RATING
    component: com.nxl.aiphotocreator.aivideogenerator.texttoimage/com.apero.rating.internal.features.activity.rating.VslRatingActivity
  - kind: wait_text
    text: ĐÁNH GIÁ
    timeout: 15

- event: rating_star_clicked
  label: bam 5 sao tren man rating app shortcut
  expect_params:
    star_value: "5"
    placement_name: app_shortcut
  reset:
    relaunch: false
  steps:
  - kind: tap
    desc: Sao 5
