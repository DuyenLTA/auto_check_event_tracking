- event: home_view
  label: mở app vào Home sau onboarding
  steps:
  - kind: launch
  - kind: allow
  - kind: close_ad
  - kind: tap
    resource_id: rootLanguageItem
    index: 1
    optional: true
  - kind: tap
    text: English (US)
    index: 0
    optional: true
  - kind: tap
    resource_id: imageButtonLanguageNext
    index: 0
    optional: true
  - kind: wait
    seconds: 3.0
  - kind: tap
    resource_id: btnNextOnboarding
    index: 0
    optional: true
  - kind: wait
    seconds: 2.0
  - kind: tap
    resource_id: btnNextOnboarding
    index: 0
    optional: true
  - kind: wait
    seconds: 2.0
  - kind: tap
    resource_id: btnNextOnboarding
    index: 0
    optional: true
  - kind: wait
    seconds: 2.0
  - kind: tap
    resource_id: btnNextOnboarding
    index: 0
    optional: true
  - kind: wait
    seconds: 2.0
  - kind: tap
    resource_id: borderContainer
    index: 0
    optional: true
  - kind: tap
    resource_id: btnNextOnboardingImage
    index: 0
    optional: true
  # Het sub: interstitial (X ve ngoai cay UI - close_ad bam BACK) roi paywall
  # RevenueCat bat ngay sau. Hai buoc close_ad: buoc dau thoat interstitial la
  # tra ve, paywall len sau phai co buoc thu hai don. Co sub thi ca hai trong.
  - kind: close_ad
    timeout: 10
  - kind: close_ad
    timeout: 6
  - kind: wait
    seconds: 3.0
  # Hai popup o home cung dat nut X desc="Close": dong theo DANH TINH, khong
  # bam "Close" theo thu tu - Check-In 1 lan/ngay, rating tu bat tu session 2.
  - kind: close_popup
    text: Check-In
    timeout: 8
  - kind: close_popup
    text: The best we can get
    timeout: 8
  - kind: wait
    seconds: 2.0
