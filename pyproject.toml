[project]
name = "auto-check-event-tracking"
version = "0.1.0"
description = "Auto Check Event Tracking - doi chieu event Firebase Analytics voi bang spec"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# web/* phai di theo package, khong thi `pip install .` xong mo trang ra 404.
#
# config/ thi KHONG dong goi duoc: no nam o goc repo, ngoai src/, ma
# package-data chi lay file BEN TRONG package. Da tung khai "data/*.yaml" o
# day nhung thu muc src/usv/data/ khong he ton tai, nen dong khai do khong
# lam gi ca ngoai viec lam nguoi doc tuong da co.
#
# Hau qua: cai kieu `pip install .` thi khong thay config/, tool chay bang gia
# tri mac dinh trong code. Hai ben dang TRUNG NHAU tung gia tri va co test giu
# (test_config_mac_dinh_khop_file.py). Duong chay chinh la ./start.sh, no cai
# `-e` nen doc thang config/ o goc repo.
[tool.setuptools.package-data]
usv = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# Test can device that bi skip mac dinh -> suite chay duoc khi khong cam may.
# Chay rieng bang: pytest -m device
addopts = "-m 'not device'"
markers = [
    "device: can device Android that (mac dinh skip)",
]
